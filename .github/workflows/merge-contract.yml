name: Merge OpenAPI contracts

on:
  # Triggered by service repos when their openapi.json is updated (Step 4).
  # Until Step 4 is wired, can be run manually.
  workflow_dispatch:
  repository_dispatch:
    types: [openapi-updated]

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.WORKSPACE_GITHUB_TOKEN }}

      - name: Checkout myblog_backend openapi.json
        uses: actions/checkout@v4
        with:
          repository: hyuntohoon/myblog_backend
          token: ${{ secrets.WORKSPACE_GITHUB_TOKEN }}
          sparse-checkout: openapi.json
          sparse-checkout-cone-mode: false
          path: _backend

      - name: Checkout myblog_music openapi.json
        uses: actions/checkout@v4
        with:
          repository: hyuntohoon/myblog_music
          token: ${{ secrets.WORKSPACE_GITHUB_TOKEN }}
          sparse-checkout: openapi.json
          sparse-checkout-cone-mode: false
          path: _music

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Merge specs
        run: python tools/merge_openapi.py _backend/openapi.json _music/openapi.json docs/contracts/openapi.json

      - name: Check for changes
        id: diff
        run: |
          git diff --exit-code docs/contracts/openapi.json && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open PR if spec changed
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.WORKSPACE_GITHUB_TOKEN }}
        run: |
          BRANCH="chore/update-merged-openapi-$(date +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add docs/contracts/openapi.json
          git commit -m "chore: update merged OpenAPI spec"
          git push origin "$BRANCH"
          gh pr create \
            --title "chore: update merged OpenAPI spec" \
            --body "Auto-generated by merge-contract workflow. Review the diff in docs/contracts/openapi.json before merging." \
            --base main \
            --head "$BRANCH"
