<style>
/* ==========================================================================
   house: notion  —  document surface + right-margin comment threads
   Every selector is prefixed with .h-notion. Custom props live on .h-notion.
   ========================================================================== */

.h-notion {
  /* Notion-ish warm neutral ramp */
  --h-notion-tx: #37352f;
  --h-notion-tx2: rgba(55, 53, 47, 0.68);
  --h-notion-tx3: rgba(55, 53, 47, 0.45);
  --h-notion-tx4: rgba(55, 53, 47, 0.26);
  --h-notion-line: rgba(55, 53, 47, 0.09);
  --h-notion-line2: rgba(55, 53, 47, 0.16);
  --h-notion-hov: rgba(55, 53, 47, 0.055);
  --h-notion-hov2: rgba(55, 53, 47, 0.085);
  --h-notion-app: #f1f0ee;
  --h-notion-panel: #ffffff;
  --h-notion-soft: #f1f1ef;
  /* pale comment highlight */
  --h-notion-yl: #fbf3db;
  --h-notion-yl-hi: #f6e5ab;
  --h-notion-gold: rgba(184, 130, 30, 0.55);
  --h-notion-gold-hi: rgba(168, 116, 18, 0.9);
  /* disputed reading */
  --h-notion-rd: #fbe4e4;
  --h-notion-rd-hi: #f6cfcf;
  --h-notion-red: rgba(200, 74, 69, 0.6);
  --h-notion-red-hi: rgba(179, 58, 58, 0.95);
  --h-notion-red-tx: #b03a3a;
  /* accents */
  --h-notion-blue: #2383e2;
  --h-notion-blue-soft: rgba(35, 131, 226, 0.062);
  --h-notion-orange-bg: #faebdd;
  --h-notion-orange-tx: #a35400;
  --h-notion-cyan-bg: #ddebf1;
  --h-notion-cyan-tx: #0b6e99;
  --h-notion-gray-bg: #e6e5e2;
  --h-notion-gray-tx: #59584f;
  --h-notion-shadow: 0 0 0 1px rgba(15, 15, 15, 0.045), 0 1px 2px rgba(15, 15, 15, 0.045);

  background: var(--h-notion-app);
  color: var(--h-notion-tx);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo",
    Pretendard, "Noto Sans KR", "Malgun Gothic", Roboto, Helvetica, Arial, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  padding: 14px 0 44px;
}

.h-notion .page {
  box-sizing: border-box;
  max-width: 1180px;
  margin: 0 auto;
  background: var(--h-notion-panel);
  border-radius: 8px;
  box-shadow: var(--h-notion-shadow);
  padding: 0 28px 8px;
  position: relative;
}

/* ---------- top bar ------------------------------------------------------ */

.h-notion .topbar {
  position: sticky;
  top: 0;
  z-index: 6;
  display: flex;
  align-items: center;
  gap: 10px;
  height: 45px;
  margin: 0 -28px;
  padding: 0 20px 0 28px;
  background: var(--h-notion-panel);
  border-radius: 8px 8px 0 0;
  font-size: 14px;
}

.h-notion .crumbs {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
  flex: 1 1 auto;
  color: var(--h-notion-tx2);
  white-space: nowrap;
  overflow: hidden;
}
.h-notion .crumb-ico { font-size: 14px; line-height: 1; }
.h-notion .crumb-sep { color: var(--h-notion-tx4); }
.h-notion .crumb-now {
  color: var(--h-notion-tx);
  overflow: hidden;
  text-overflow: ellipsis;
}

.h-notion button {
  font: inherit;
  color: inherit;
  border: 0;
  background: none;
  margin: 0;
  cursor: pointer;
}

.h-notion .tbtn {
  box-sizing: border-box;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 28px;
  padding: 0 8px;
  border-radius: 4px;
  font-size: 14px;
  color: var(--h-notion-tx2);
  transition: background 90ms ease;
  white-space: nowrap;
  flex: 0 0 auto;
}
.h-notion .tbtn:hover { background: var(--h-notion-hov); }
.h-notion .tbtn[aria-pressed="true"] { color: var(--h-notion-tx); background: var(--h-notion-hov); }
.h-notion .tbtn svg { width: 15px; height: 15px; display: block; }

.h-notion .ico {
  fill: none;
  stroke: currentColor;
  stroke-width: 1.4;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* ---------- two-column body --------------------------------------------- */

.h-notion .body {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 0;
  padding-top: 6px;
}
.h-notion.mode-wide .body {
  grid-template-columns: minmax(0, 1fr) 340px;
  gap: 36px;
}
.h-notion.mode-wide.rail-off .body { grid-template-columns: minmax(0, 1fr); gap: 0; }

.h-notion .doc { min-width: 0; }
.h-notion .doc-in {
  box-sizing: border-box;
  max-width: 780px;
  padding-left: 32px; /* gutter that the hover line numbers sit in */
}
.h-notion.mode-narrow .doc-in { padding-left: 0; max-width: none; }

/* ---------- document header --------------------------------------------- */

.h-notion .pico {
  font-size: 52px;
  line-height: 1;
  margin: 22px 0 6px;
  user-select: none;
}
.h-notion .ptitle {
  margin: 0 0 2px;
  font-size: 40px;
  line-height: 1.18;
  font-weight: 700;
  letter-spacing: -0.021em;
  color: var(--h-notion-tx);
}
.h-notion .psub {
  margin: 0 0 14px;
  font-size: 14px;
  color: var(--h-notion-tx3);
}

.h-notion .props { margin: 0 0 18px; }
.h-notion .prow {
  display: grid;
  grid-template-columns: 168px minmax(0, 1fr);
  align-items: start;
  gap: 8px;
  padding: 4px 0;
  font-size: 14px;
}
.h-notion .plab {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 1px 6px;
  margin-left: -6px;
  border-radius: 4px;
  color: var(--h-notion-tx2);
  transition: background 90ms ease;
}
.h-notion .prow:hover .plab { background: var(--h-notion-hov); }
.h-notion .plab svg { width: 14px; height: 14px; flex: 0 0 auto; color: var(--h-notion-tx3); }
.h-notion .pval { padding: 1px 0; color: var(--h-notion-tx); overflow-wrap: anywhere; }
.h-notion .pdim { color: var(--h-notion-tx3); }

/* callout — the one quiet disclaimer */
.h-notion .callout {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  background: var(--h-notion-soft);
  border-radius: 4px;
  padding: 14px 16px;
  margin: 0 0 14px;
  font-size: 14px;
  line-height: 1.6;
  color: var(--h-notion-tx2);
}
.h-notion .callout svg { width: 16px; height: 16px; flex: 0 0 auto; margin-top: 2px; color: var(--h-notion-tx3); }

/* toggle block (track blurb) */
.h-notion .tg {
  margin: 0 0 6px;
  font-size: 14px;
  border-radius: 4px;
}
.h-notion .tg > summary {
  list-style: none;
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 4px 6px;
  margin-left: -6px;
  border-radius: 4px;
  color: var(--h-notion-tx2);
  cursor: pointer;
  transition: background 90ms ease;
}
.h-notion .tg > summary::-webkit-details-marker { display: none; }
.h-notion .tg > summary:hover { background: var(--h-notion-hov); }
.h-notion .tg > summary svg {
  width: 13px;
  height: 13px;
  color: var(--h-notion-tx3);
  transition: transform 120ms ease;
}
.h-notion .tg[open] > summary svg { transform: rotate(90deg); }
.h-notion .tg-body {
  padding: 4px 0 10px 22px;
  font-size: 14px;
  line-height: 1.72;
  color: var(--h-notion-tx2);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.h-notion .rule {
  border: 0;
  border-top: 1px solid var(--h-notion-line);
  margin: 16px 0 10px;
}

/* ---------- lyric blocks ------------------------------------------------- */

.h-notion .lyrics { margin: 0 0 8px; }

/* One lyric line = one block. The block spacing is what lets 14 threads sit
   beside their own lines on the dense track instead of piling up. */
.h-notion .ln {
  position: relative;
  padding: 7px 2px;
  border-radius: 3px;
}
.h-notion .ln:hover { background: rgba(55, 53, 47, 0.022); }

.h-notion .num {
  position: absolute;
  left: -32px;
  top: 9px;
  width: 24px;
  text-align: right;
  font-size: 11.5px;
  line-height: 1.6;
  font-variant-numeric: tabular-nums;
  color: var(--h-notion-tx4);
  opacity: 0;
  transition: opacity 90ms ease;
  user-select: none;
}
.h-notion .ln:hover .num,
.h-notion .ln.is-active .num { opacity: 1; }
.h-notion.mode-narrow .num { display: none; }

.h-notion .lx {
  font-size: 16px;
  line-height: 1.62;
  overflow-wrap: anywhere;
}
.h-notion .lx-gap {
  color: var(--h-notion-tx4);
  letter-spacing: 0.34em;
  font-size: 13px;
  padding: 10px 0 4px;
  user-select: none;
}

/* the marked passage — text-hugging pale highlight */
.h-notion .mk {
  display: inline;
  padding: 1px 2px;
  border-radius: 2px;
  background: var(--h-notion-yl);
  box-shadow: inset 0 -1.5px 0 var(--h-notion-gold);
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  cursor: pointer;
  transition: background 100ms ease, box-shadow 100ms ease;
}
.h-notion .mk:hover { background: var(--h-notion-yl-hi); }

/* two comments on one line: two underlines, one per comment */
.h-notion .mk.dbl {
  padding-bottom: 3px;
  box-shadow:
    inset 0 -1.5px 0 var(--h-notion-gold),
    inset 0 -3px 0 var(--h-notion-yl),
    inset 0 -4.5px 0 var(--h-notion-gold);
}
/* disputed reading (negative votes) — pale red instead of pale yellow */
.h-notion .mk.dsp {
  background: var(--h-notion-rd);
  box-shadow: inset 0 -1.5px 0 var(--h-notion-red);
}
.h-notion .mk.dsp:hover { background: var(--h-notion-rd-hi); }
.h-notion .mk.dbl.dsp {
  background: var(--h-notion-yl);
  box-shadow:
    inset 0 -1.5px 0 var(--h-notion-red),
    inset 0 -3px 0 var(--h-notion-yl),
    inset 0 -4.5px 0 var(--h-notion-gold);
}
.h-notion .mk.dbl.dsp:hover { background: var(--h-notion-yl-hi); }

.h-notion .mk.is-on {
  background: var(--h-notion-yl-hi);
  box-shadow: inset 0 -2px 0 var(--h-notion-gold-hi);
}
.h-notion .mk.is-on.dsp {
  background: var(--h-notion-rd-hi);
  box-shadow: inset 0 -2px 0 var(--h-notion-red-hi);
}

/* the repeat of a chorus line — admitted, but subordinate */
.h-notion .ek {
  display: inline;
  padding: 1px 2px 1px;
  border-bottom: 1px dashed var(--h-notion-gold);
  cursor: pointer;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  transition: background 100ms ease;
}
.h-notion .ek:hover { background: var(--h-notion-yl); }
.h-notion .ek.is-on { background: var(--h-notion-yl); }

.h-notion .mk:focus-visible,
.h-notion .ek:focus-visible,
.h-notion .tbtn:focus-visible,
.h-notion .cbtn:focus-visible,
.h-notion .tg > summary:focus-visible,
.h-notion .c-link:focus-visible,
.h-notion .card:focus-visible {
  outline: 2px solid var(--h-notion-blue);
  outline-offset: 2px;
  border-radius: 3px;
}
.h-notion .mk:focus,
.h-notion .ek:focus,
.h-notion .card:focus { outline: none; }

.h-notion .sr {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

/* ---------- document footer ---------------------------------------------- */

.h-notion .foot {
  margin: 22px 0 8px;
  font-size: 12.5px;
  line-height: 1.75;
  color: var(--h-notion-tx3);
}
.h-notion .foot p { margin: 0 0 3px; }
.h-notion .refcap { color: var(--h-notion-tx4); }

/* ---------- right margin rail -------------------------------------------- */

.h-notion .rail { position: relative; min-width: 0; }
.h-notion.mode-narrow .rail { display: none; }
.h-notion.rail-off .rail { display: none; }

.h-notion .rail-head {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 26px 2px 8px;
  font-size: 13px;
  color: var(--h-notion-tx3);
}
.h-notion .rail-title { font-size: 14px; font-weight: 600; color: var(--h-notion-tx2); }
.h-notion .rail-legend {
  padding: 0 2px 10px;
  font-size: 11.5px;
  line-height: 1.7;
  color: var(--h-notion-tx4);
}
.h-notion .swatch {
  display: inline-block;
  width: 20px;
  height: 9px;
  border-radius: 2px;
  vertical-align: -1px;
  margin-right: 3px;
}
.h-notion .sw-y { background: var(--h-notion-yl); box-shadow: inset 0 -1.5px 0 var(--h-notion-gold); }
.h-notion .sw-r { background: var(--h-notion-rd); box-shadow: inset 0 -1.5px 0 var(--h-notion-red); }

.h-notion .ro-head {
  padding: 10px 2px 6px;
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.03em;
  color: var(--h-notion-tx3);
}
.h-notion .orphans { margin-bottom: 8px; }

.h-notion .canvas { position: relative; }
.h-notion.mode-narrow .canvas { position: static; }

/* ---------- comment card -------------------------------------------------- */

.h-notion .card {
  box-sizing: border-box;
  background: var(--h-notion-panel);
  border: 1px solid var(--h-notion-line2);
  border-radius: 6px;
  padding: 10px 12px 9px;
  margin-bottom: 8px;
  font-size: 14px;
  transition: box-shadow 110ms ease, background 110ms ease, border-color 110ms ease;
}
.h-notion.mode-wide .canvas .card {
  position: absolute;
  left: 0;
  right: 0;
  margin-bottom: 0;
}
.h-notion .card:hover { border-color: rgba(55, 53, 47, 0.24); }
.h-notion .card.is-on {
  background: var(--h-notion-blue-soft);
  border-color: rgba(35, 131, 226, 0.34);
  box-shadow: 0 0 0 1px rgba(35, 131, 226, 0.14), 0 2px 6px rgba(15, 15, 15, 0.06);
}
.h-notion .card.dsp { border-color: rgba(200, 74, 69, 0.28); }
.h-notion .card.dsp.is-on { background: rgba(224, 62, 62, 0.045); border-color: rgba(200, 74, 69, 0.45); }

.h-notion .c-head {
  display: flex;
  align-items: center;
  gap: 7px;
  flex-wrap: wrap;
  margin-bottom: 6px;
}
.h-notion .avatar {
  width: 20px;
  height: 20px;
  flex: 0 0 auto;
  border-radius: 50%;
  background: var(--h-notion-gray-bg);
  color: var(--h-notion-tx3);
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.h-notion .avatar svg { width: 12px; height: 12px; }
.h-notion .c-name { font-size: 13.5px; font-weight: 500; color: var(--h-notion-tx); }
.h-notion .c-meta { font-size: 12px; color: var(--h-notion-tx3); }

.h-notion .chip {
  font-size: 11.5px;
  line-height: 1.5;
  font-weight: 500;
  padding: 1px 6px;
  border-radius: 3px;
  background: var(--h-notion-gray-bg);
  color: var(--h-notion-gray-tx);
  white-space: nowrap;
}
.h-notion .chip.k-partial { background: var(--h-notion-orange-bg); color: var(--h-notion-orange-tx); }
.h-notion .chip.k-repeated { background: var(--h-notion-cyan-bg); color: var(--h-notion-cyan-tx); }
.h-notion .chip.k-dsp { background: var(--h-notion-rd); color: var(--h-notion-red-tx); }

.h-notion .c-meta { font-variant-numeric: tabular-nums; }
.h-notion .c-quote {
  margin: 0 0 7px;
  padding-left: 9px;
  border-left: 2px solid var(--h-notion-line2);
  font-size: 12.5px;
  line-height: 1.6;
  color: var(--h-notion-tx2);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.h-notion .c-note {
  font-size: 12px;
  line-height: 1.6;
  color: var(--h-notion-tx3);
  margin: 0 0 7px;
}
.h-notion .c-note.warn {
  color: var(--h-notion-red-tx);
  background: var(--h-notion-rd);
  border-radius: 3px;
  padding: 5px 8px;
}

/* A collapsed thread is head + preview only. The quoted passage and the
   status notes return on open — the passage is already highlighted in the
   document a few centimetres to the left. The disputed warning never hides. */
.h-notion .card:not(.is-open):not(.is-short) .c-quote,
.h-notion .card:not(.is-open):not(.is-short) .c-note:not(.warn) { display: none; }

.h-notion .c-body {
  font-size: 13.5px;
  line-height: 1.75;
  color: var(--h-notion-tx);
  /* two lines collapsed — the gist is written to fit, and keeping the row
     short is what lets every thread stay next to its own line */
  max-height: 52px;
  overflow: hidden;
  -webkit-mask-image: linear-gradient(180deg, #000 62%, rgba(0, 0, 0, 0.1) 100%);
  mask-image: linear-gradient(180deg, #000 62%, rgba(0, 0, 0, 0.1) 100%);
  overflow-wrap: anywhere;
}
/* No one-line gist for this comment? Then the preview has to do the
   summarising, so give it twice the room. */
.h-notion .card.no-gist:not(.is-open):not(.is-short) .c-body { max-height: 96px; }

/* Unanchored comments sit above the anchored ones, so collapsed they are one
   line tall — otherwise they push every anchored thread away from its line. */
.h-notion .card.is-orphan:not(.is-open):not(.is-short) .c-body { max-height: 26px; }
.h-notion .card.is-orphan:not(.is-open):not(.is-short) { padding: 8px 11px 7px; }

.h-notion .card.is-open .c-body,
.h-notion .card.is-short .c-body {
  max-height: none;
  overflow: visible;
  -webkit-mask-image: none;
  mask-image: none;
}

.h-notion .c-p { margin: 0; }
.h-notion .c-p.gap { margin-top: 0.72em; }
.h-notion .c-lead { font-weight: 600; }
.h-notion .c-lead + .c-p,
.h-notion .c-lead + .c-q { margin-top: 0.62em; }
.h-notion .c-q {
  margin: 0.72em 0;
  padding-left: 11px;
  border-left: 3px solid var(--h-notion-line2);
  color: var(--h-notion-tx2);
}
.h-notion .c-q .c-p { margin: 0; }
.h-notion .c-b { font-weight: 600; }
.h-notion .c-i { font-style: italic; color: var(--h-notion-tx2); }
.h-notion .c-code {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.86em;
  background: rgba(135, 131, 120, 0.15);
  color: #b64b3f;
  border-radius: 3px;
  padding: 0.15em 0.35em;
}
.h-notion .c-link {
  color: inherit;
  text-decoration: none;
  border-bottom: 1px solid var(--h-notion-line2);
  overflow-wrap: anywhere;
}
.h-notion .c-link:hover { border-bottom-color: var(--h-notion-tx3); }

.h-notion .c-foot {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-wrap: wrap;
  margin-top: 7px;
}
.h-notion .cbtn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  color: var(--h-notion-tx3);
  padding: 2px 6px;
  margin-left: -6px;
  border-radius: 3px;
  transition: background 90ms ease, color 90ms ease;
}
.h-notion .cbtn:hover { background: var(--h-notion-hov); color: var(--h-notion-tx2); }
.h-notion .cbtn svg { width: 12px; height: 12px; }
.h-notion .cbtn + .cbtn { margin-left: 0; }
.h-notion .card.is-short .c-more { display: none; }
.h-notion .c-src { opacity: 0; transition: opacity 100ms ease; }
.h-notion .card:hover .c-src,
.h-notion .card.is-on .c-src,
.h-notion .c-src:focus-visible { opacity: 1; }
.h-notion.mode-narrow .c-src { opacity: 1; }

.h-notion .c-es {
  margin-top: 7px;
  padding-top: 7px;
  border-top: 1px solid var(--h-notion-line);
  font-size: 12.5px;
  line-height: 1.7;
  color: var(--h-notion-tx2);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

/* ---------- anchor connector (active thread only) ------------------------ */

.h-notion .conn {
  position: absolute;
  background: var(--h-notion-line2);
  pointer-events: none;
  opacity: 0;
  transition: opacity 120ms ease;
}
.h-notion .conn.on { opacity: 1; }
.h-notion.mode-narrow .conn { display: none; }
.h-notion.rail-off .conn { display: none; }

/* ---------- mobile sheet -------------------------------------------------- */

.h-notion .scrim {
  position: fixed;
  inset: 0;
  background: rgba(15, 15, 15, 0.26);
  z-index: 60;
  opacity: 0;
  pointer-events: none;
  transition: opacity 150ms ease;
}
.h-notion .scrim.on { opacity: 1; pointer-events: auto; }

.h-notion .sheet {
  box-sizing: border-box;
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 61;

          var where = a.repeats.map(function (r) {
            return (r[0] === r[1]) ? (r[0] + 1) + '행' : (r[0] + 1) + '–' + (r[1] + 1) + '행';
          }).join(', ');
          c.appendChild(el('div', 'c-note',
            (a.repeatKind === 'line' ? '같은 구절이 ' : '같은 표현이 ') + where +
            (a.echoShown
              ? '에 다시 나옵니다. 그쪽 가사에는 점선을 그어 두었습니다.'
              : '에 다시 나옵니다. 그 행에는 그 행만의 코멘트가 따로 달려 있어 점선은 긋지 않았습니다.')));
        }

        if (a.fragment) {
          var q = el('blockquote', 'c-quote', a.fragment.split('\n').map(function (x) {
            return x.trim();
          }).join('\n'));
          q.setAttribute('dir', 'auto');
          c.appendChild(q);
        }

        if (a.disputed) {
          c.appendChild(el('div', 'c-note warn',
            '커뮤니티에서 이견이 제기된 해석입니다 (' + num(a.votes) + ').'));
        }
        if (meta.note) c.appendChild(el('div', 'c-note', meta.note));

        var bodyBox = el('div', 'c-body');
        if (a.gist) {
          // the one-line gist leads, so a collapsed card still says something
          var g = el('p', 'c-p c-lead');
          g.setAttribute('dir', 'auto');
          inlineInto(g, a.gist);
          bodyBox.appendChild(g);
        }
        renderBody(bodyBox, a.bodyKo);
        c.appendChild(bodyBox);

        var footRow = el('div', 'c-foot');
        var more = el('button', 'cbtn c-more', '더 보기');
        more.type = 'button';
        footRow.appendChild(more);

        var esBox = null;
        if (a.bodyEs) {
          var esBtn = el('button', 'cbtn c-src', 'ES 원문');
          esBtn.type = 'button';
          esBtn.setAttribute('aria-expanded', 'false');
          footRow.appendChild(esBtn);
          esBox = el('div', 'c-es');
          esBox.setAttribute('dir', 'auto');
          esBox.textContent = a.bodyEs;
          esBox.hidden = true;
          esBtn.addEventListener('click', function (ev) {
            ev.stopPropagation();
            esBox.hidden = !esBox.hidden;
            esBtn.setAttribute('aria-expanded', esBox.hidden ? 'false' : 'true');
            relayout();
          });
        }
        if (a.url) {
          var link = el('a', 'cbtn c-src c-link', '원문');
          link.href = a.url;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.style.borderBottom = '0';
          link.appendChild(icon('out'));
          link.addEventListener('click', function (ev) { ev.stopPropagation(); });
          footRow.appendChild(link);
        }
        c.appendChild(footRow);
        if (esBox) c.appendChild(esBox);

        more.addEventListener('click', function (ev) {
          ev.stopPropagation();
          toggleOpen(a.key);
        });
        c.addEventListener('click', function () { activate([a.key], 'card'); });

        cards[a.key] = { el: c, body: bodyBox, more: more, ann: a, measured: false };
        order.push(a.key);
        return c;
      }

      // unlocated comments live at the top of the rail, like page comments
      if (orphans.length) {
        var ro = el('div', 'orphans');
        ro.appendChild(el('div', 'ro-head',
          '구절에 붙지 못한 코멘트 ' + orphans.length + '개'));
        orphans.forEach(function (a) { ro.appendChild(cardFor(a)); });
        threadList.appendChild(ro);
      }

      var canvas = el('div', 'canvas');
      located.forEach(function (a) { canvas.appendChild(cardFor(a)); });
      threadList.appendChild(canvas);

      // ---------------- sheet (narrow mode) ----------------
      var scrim = el('div', 'scrim');
      var sheet = el('div', 'sheet');
      sheet.setAttribute('role', 'dialog');
      sheet.setAttribute('aria-modal', 'true');
      sheet.setAttribute('aria-label', '코멘트 목록');
      sheet.appendChild(el('div', 'grab'));
      var sheetHead = el('div', 'sheet-head');
      sheetHead.appendChild(el('span', 'sheet-title',
        '코멘트 ' + anns.length + '개'));
      var sheetSlot = el('span');
      sheetHead.appendChild(sheetSlot);
      var xbtn = el('button', 'xbtn');
      xbtn.type = 'button';
      xbtn.setAttribute('aria-label', '닫기');
      xbtn.appendChild(icon('close'));
      sheetHead.appendChild(xbtn);
      sheet.appendChild(sheetHead);
      var sheetBody = el('div', 'sheet-body');
      sheet.appendChild(sheetBody);
      page.appendChild(scrim);
      page.appendChild(sheet);

      rail.appendChild(threadList); // wide default

      // ---------------- state ----------------
      var mode = null;
      // a line carries two comments ~1.5% of the time; both go active together
      var activeKeys = [];
      var openSet = Object.create(null);
      var sheetOpen = false;
      var lastFocus = null;
      var reduced = false;
      try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}

      function allOpen() {
        for (var i = 0; i < order.length; i++) if (!openSet[order[i]]) return false;
        return order.length > 0;
      }
      function syncAllBtn() {
        btnAllLabel.textContent = allOpen()
          ? '모두 접기' : '모두 펼치기';
      }
      function isActive(k) { return activeKeys.indexOf(k) !== -1; }

      function paint() {
        order.forEach(function (k) {
          var c = cards[k];
          c.el.classList.toggle('is-open', !!openSet[k]);
          c.el.classList.toggle('is-on', isActive(k));
        });
        Object.keys(markSpans).forEach(function (k) {
          markSpans[k].forEach(function (sp) {
            var keys = (sp.getAttribute('data-keys') || '').split(' ');
            var on = false;
            for (var i = 0; i < keys.length; i++) if (isActive(keys[i])) { on = true; break; }
            sp.classList.toggle('is-on', on);
          });
        });
        syncAllBtn();
      }
      function toggleOpen(k) {
        openSet[k] = !openSet[k];
        paint();
        relayout();
      }
      function setActive(keys) {
        activeKeys = keys.filter(function (k) { return !!cards[k]; });
        if (!allOpen()) {
          // one passage in focus at a time keeps the margin anchored
          openSet = Object.create(null);
          activeKeys.forEach(function (k) { openSet[k] = true; });
        }
        paint();
        relayout();
      }

      function scrollTo(node, block) {
        if (!node) return;
        try {
          node.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: block || 'center' });
        } catch (e) { node.scrollIntoView(); }
      }

      function activate(keys, from) {
        keys = keys.filter(function (x) { return !!cards[x]; });
        if (!keys.length) return;
        var k = keys[0];
        setActive(keys);
        if (mode === 'narrow') {
          openSheet();
          window.setTimeout(function () { scrollInSheet(k); }, sheetOpen ? 0 : 210);
          return;
        }
        if (from === 'lyric') {
          var c = cards[k].el;
          var r = c.getBoundingClientRect();
          if (r.top < 8 || r.bottom > (window.innerHeight || 800) - 8) scrollTo(c, 'nearest');
        } else if (from === 'card') {
          var spans = markSpans[k];
          if (spans && spans.length) {
            var sr = spans[0].getBoundingClientRect();
            if (sr.top < 60 || sr.bottom > (window.innerHeight || 800) - 20) scrollTo(spans[0], 'center');
          }
        }
      }

      function scrollInSheet(k) {
        var c = cards[k];
        if (!c) return;
        var top = c.el.offsetTop - sheetBody.offsetTop - 8;
        try {
          sheetBody.scrollTo({ top: Math.max(0, top), behavior: reduced ? 'auto' : 'smooth' });
        } catch (e) { sheetBody.scrollTop = Math.max(0, top); }
      }

      function openSheet() {
        if (sheetOpen) return;
        sheetOpen = true;
        lastFocus = document.activeElement;
        scrim.classList.add('on');
        sheet.classList.add('on');
        measureShort();
        xbtn.focus();
      }
      function closeSheet() {
        if (!sheetOpen) return;
        sheetOpen = false;
        scrim.classList.remove('on');
        sheet.classList.remove('on');
        // The sheet becomes visibility:hidden, so anything focused inside it is
        // about to be blurred to the document. Land the reader on their passage.
        var back = null;
        if (lastFocus && lastFocus.focus && lastFocus.isConnected &&
            rootEl.contains(lastFocus) && !sheet.contains(lastFocus)) back = lastFocus;
        if (!back && activeKeys.length) {
          var sp = markSpans[activeKeys[0]];
          if (sp && sp.length) back = sp[0];
        }
        if (!back) back = btnComments;
        try { back.focus(); } catch (e) {}
        lastFocus = null;
      }

      // ---------------- measuring + margin layout ----------------
      function measureShort() {
        order.forEach(function (k) {
          var c = cards[k];
          if (c.measured) return;
          if (!c.el.offsetParent && c.el.offsetHeight === 0) return; // not visible yet
          c.measured = true;
          // nothing hidden -> no "더 보기", and the quote/notes stay visible
          var limit = !c.ann.located ? 28 : (c.ann.gist ? 54 : 98);
          if (c.body.scrollHeight <= limit) c.el.classList.add('is-short');
        });
      }

      // Coalesce layout passes into one frame. A plain "already scheduled"
      // guard would wedge forever if the frame callback never arrives (hidden
      // tab, throttled clock), so a timer races the frame and either one wins.
      var rafId = 0, timerId = 0;
      function runLayout() {
        if (rafId) { window.cancelAnimationFrame(rafId); rafId = 0; }
        if (timerId) { window.clearTimeout(timerId); timerId = 0; }
        measureShort();
        layout();
      }
      function relayout() {
        if (rafId) window.cancelAnimationFrame(rafId);
        if (timerId) window.clearTimeout(timerId);
        rafId = window.requestAnimationFrame(runLayout);
        timerId = window.setTimeout(runLayout, 120);
      }

      function layout() {
        if (mode !== 'wide' || rootEl.classList.contains('rail-off')) {
          located.forEach(function (a) { cards[a.key].el.style.top = ''; });
          canvas.style.height = '';
          connA.classList.remove('on');
          connB.classList.remove('on');
          connC.classList.remove('on');
          return;
        }
        var cRect = canvas.getBoundingClientRect();
        var n = located.length;
        if (!n) { canvas.style.height = ''; return; }

        // read phase
        var want = new Array(n), hgt = new Array(n);
        for (var i = 0; i < n; i++) {
          var a = located[i];
          var anchor = lineEls[a.span[0]];
          want[i] = anchor ? (anchor.getBoundingClientRect().top - cRect.top) : 0;
          hgt[i] = cards[a.key].el.offsetHeight;
        }

        var tops = new Array(n);
        var pivot = -1;
        for (var p = 0; p < n; p++) if (isActive(located[p].key)) { pivot = p; break; }

        if (pivot === -1) {
          var y = 0;
          for (var j = 0; j < n; j++) { tops[j] = Math.max(want[j], y); y = tops[j] + hgt[j] + 8; }
        } else {
          // the active thread stays pinned to its line; neighbours give way
          tops[pivot] = Math.max(0, want[pivot]);
          for (var u = pivot - 1; u >= 0; u--) {
            tops[u] = Math.min(want[u], tops[u + 1] - 8 - hgt[u]);
          }
          if (n && tops[0] < 0) {
            var shift = -tops[0];
            for (var s2 = 0; s2 <= pivot; s2++) tops[s2] += shift;
          }
          for (var d2 = pivot + 1; d2 < n; d2++) {
            tops[d2] = Math.max(want[d2], tops[d2 - 1] + hgt[d2 - 1] + 8);
          }
        }

        // write phase
        var bottom = 0;
        for (var w = 0; w < n; w++) {
          cards[located[w].key].el.style.top = Math.round(tops[w]) + 'px';
          bottom = Math.max(bottom, tops[w] + hgt[w]);
        }
        canvas.style.height = Math.round(bottom + 24) + 'px';

        drawConnector(pivot, tops, cRect);
      }

      function drawConnector(pivot, tops, cRect) {
        if (pivot < 0) {
          connA.classList.remove('on'); connB.classList.remove('on'); connC.classList.remove('on');
          return;
        }
        var a = located[pivot];
        var anchor = lineEls[a.span[0]];
        if (!anchor) { connA.classList.remove('on'); return; }
        var bRect = body.getBoundingClientRect();
        var aRect = anchor.getBoundingClientRect();
        var dRect = doc.getBoundingClientRect();
        var rRect = rail.getBoundingClientRect();
        var x1 = dRect.right - bRect.left + 6;
        var x2 = rRect.left - bRect.left - 6;
        if (x2 <= x1) { connA.classList.remove('on'); connB.classList.remove('on'); connC.classList.remove('on'); return; }
        var xm = (x1 + x2) / 2;
        var y1 = aRect.top - bRect.top + aRect.height / 2;
        var y2 = (cRect.top - bRect.top) + tops[pivot] + 16;

        connA.style.left = x1 + 'px'; connA.style.width = (xm - x1) + 'px';
        connA.style.top = Math.round(y1) + 'px'; connA.style.height = '1px';
        connB.style.left = Math.round(xm) + 'px'; connB.style.width = '1px';
        connB.style.top = Math.round(Math.min(y1, y2)) + 'px';
        connB.style.height = Math.max(1, Math.abs(y2 - y1)) + 'px';
        connC.style.left = Math.round(xm) + 'px'; connC.style.width = (x2 - xm) + 'px';
        connC.style.top = Math.round(y2) + 'px'; connC.style.height = '1px';
        connA.classList.add('on'); connB.classList.add('on'); connC.classList.add('on');
      }

      // ---------------- mode switching (container-driven, not viewport) ----
      function applyMode() {
        var w = rootEl.clientWidth || root.clientWidth || 0;
        var next = (w === 0 || w >= 1060) ? 'wide' : 'narrow';
        if (next === mode) return false;
        mode = next;
        rootEl.classList.toggle('mode-wide', mode === 'wide');
        rootEl.classList.toggle('mode-narrow', mode === 'narrow');
        if (mode === 'wide') {
          closeSheet();
          rail.appendChild(threadList);
          topbar.insertBefore(btnAll, btnComments.nextSibling);
          btnComments.setAttribute('aria-pressed', rootEl.classList.contains('rail-off') ? 'false' : 'true');
        } else {
          sheetBody.appendChild(threadList);
          sheetSlot.appendChild(btnAll);
          btnComments.removeAttribute('aria-pressed');
          located.forEach(function (a) { cards[a.key].el.style.top = ''; });
          canvas.style.height = '';
        }
        return true;
      }

      // ---------------- events ----------------
      lyrics.addEventListener('click', function (ev) {
        var t = ev.target;
        while (t && t !== lyrics && !t.getAttribute) t = t.parentNode;
        var hit = null;
        var node = ev.target;
        while (node && node !== lyrics) {
          if (node.classList && (node.classList.contains('mk') || node.classList.contains('ek'))) { hit = node; break; }
          node = node.parentNode;
        }
        if (!hit) return;
        var keys = (hit.getAttribute('data-keys') || '').split(' ').filter(Boolean);
        if (!keys.length) return;
        activate(keys, 'lyric');
      });
      lyrics.addEventListener('keydown', function (ev) {
        if (ev.key !== 'Enter' && ev.key !== ' ' && ev.key !== 'Spacebar') return;
        var node = ev.target;
        if (!node.classList || !(node.classList.contains('mk') || node.classList.contains('ek'))) return;
        ev.preventDefault();
        var keys = (node.getAttribute('data-keys') || '').split(' ').filter(Boolean);
        if (keys.length) activate(keys, 'lyric');
      });

      btnComments.addEventListener('click', function () {
        if (mode === 'narrow') { openSheet(); return; }
        var off = rootEl.classList.toggle('rail-off');
        btnComments.setAttribute('aria-pressed', off ? 'false' : 'true');
        relayout();
      });
      btnAll.addEventListener('click', function () {
        var open = !allOpen();
        openSet = Object.create(null);
        if (open) order.forEach(function (k) { openSet[k] = true; });
        paint();
        relayout();
      });
      xbtn.addEventListener('click', closeSheet);
      scrim.addEventListener('click', closeSheet);
      sheet.addEventListener('keydown', function (ev) {
        if (ev.key === 'Escape' || ev.key === 'Esc') { ev.stopPropagation(); closeSheet(); }
      });

      // ---------------- observe own width; no global listeners -------------
      var ro2 = null;
      if (typeof window.ResizeObserver === 'function') {
        ro2 = new window.ResizeObserver(function () {
          if (!rootEl.isConnected) { if (ro2) ro2.disconnect(); return; }
          applyMode();
          relayout();
        });
        ro2.observe(rootEl);
      }
      root.__hNotionCleanup = function () {
        if (ro2) { ro2.disconnect(); ro2 = null; }
        if (rafId) { window.cancelAnimationFrame(rafId); rafId = 0; }
        if (timerId) { window.clearTimeout(timerId); timerId = 0; }
      };

      applyMode();
      paint();
      relayout();
      window.setTimeout(relayout, 60);   // after fonts settle
      window.setTimeout(relayout, 320);
    },

    unmount: function (root) {
      if (root && typeof root.__hNotionCleanup === 'function') {
        try { root.__hNotionCleanup(); } catch (e) {}
        root.__hNotionCleanup = null;
      }
      if (root) root.innerHTML = '';
    }
  };
})();
</script>
