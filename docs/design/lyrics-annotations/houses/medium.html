<style>
/* ============================================================
   house: medium — long-form reading surface
   One narrow measure, large serif, small sans for everything
   that is not the text. Near-black on white, hairline rules,
   almost no colour. Marked passages carry a quiet tint; the
   note lives just off the measure and opens inside it.
   Every selector is namespaced under .h-medium.
   ============================================================ */

.h-medium {
  /* container queries: the layout answers to the column it is
     given, not to the viewport (this is a fragment). */
  container-type: inline-size;
  container-name: h-medium-col;

  --h-medium-ink: #242424;
  --h-medium-ink-2: #33322f;
  --h-medium-grey: #6b6b6b;
  --h-medium-grey-2: #9b9b9b;
  --h-medium-rule: #e4e2df;
  --h-medium-rule-2: #f1efec;

  --h-medium-tint: #fdf2cd;        /* endorsed highlight */
  --h-medium-tint-on: #f7e29b;     /* highlight, note open */
  --h-medium-tint-2: #f9e8b4;      /* two annotations on one line */
  --h-medium-tint-echo: #fbf7e7;   /* the repeat of a chorus */
  --h-medium-dispute: #8e96a1;     /* disputed reading: no fill, a dashed rule */
  --h-medium-dispute-on: #5d6674;
  --h-medium-accent: #1a8917;

  --h-medium-serif: Charter, "Bitstream Charter", "Iowan Old Style", "Source Serif Pro", Georgia, "Nanum Myeongjo", "AppleMyungjo", "Apple SD Gothic Neo", "Malgun Gothic", serif;
  --h-medium-sans: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Apple SD Gothic Neo", "Segoe UI", "Malgun Gothic", Arial, sans-serif;
  --h-medium-arab: "Geeza Pro", "Al Bayan", "Noto Naskh Arabic", "Segoe UI", serif;

  --h-medium-gut: 1.125rem;   /* left gutter that holds the range brackets */
  --h-medium-b0: -0.9375rem;  /* bracket x, lane 0 */
  --h-medium-b1: -0.4375rem;  /* bracket x, lane 1 (two annotations deep) */
  --h-medium-mw: 100%;        /* the measure */
  --h-medium-ly: 21px;        /* lyric size  */
  --h-medium-lh: 36px;        /* lyric leading */

  background: #fff;
  color: var(--h-medium-ink);
  font-family: var(--h-medium-sans);
  font-size: 16px;
  line-height: 1.5;
  text-align: left;
  padding: 2.75rem 0 4.5rem;
  max-width: 100%;
  overflow-wrap: break-word;
  word-break: keep-all;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

.h-medium *,
.h-medium *::before,
.h-medium *::after { box-sizing: border-box; }

.h-medium :focus-visible {
  outline: 2px solid var(--h-medium-accent);
  outline-offset: 3px;
  border-radius: 1px;
}

.h-medium .md-shell {
  max-width: 43.25rem;         /* gutter + measure + padding */
  margin: 0 auto;
  padding-inline: 1.25rem;
}

/* ---------- header ---------------------------------------- */

.h-medium .md-head {
  margin-left: var(--h-medium-gut);
  max-width: var(--h-medium-mw);
}

.h-medium .md-kicker {
  margin: 0 0 1.125rem;
  font-size: 12px;
  line-height: 1.4;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--h-medium-grey);
  font-weight: 500;
}

.h-medium .md-title {
  margin: 0;
  font-family: var(--h-medium-serif);
  font-size: 32px;
  line-height: 1.16;
  font-weight: 700;
  letter-spacing: -0.022em;
  color: var(--h-medium-ink);
}

.h-medium .md-title-orig {
  display: block;
  margin-top: 0.35rem;
  font-family: var(--h-medium-sans);
  font-size: 14px;
  font-weight: 400;
  letter-spacing: 0;
  color: var(--h-medium-grey-2);
}

.h-medium .md-sub {
  margin: 0.75rem 0 0;
  font-size: 15px;
  line-height: 1.5;
  color: var(--h-medium-grey);
}

.h-medium .md-byline {
  margin-top: 1.75rem;
  padding: 0.9375rem 0;
  border-top: 1px solid var(--h-medium-rule);
  border-bottom: 1px solid var(--h-medium-rule);
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem 1.25rem;
  align-items: baseline;
  justify-content: space-between;
}

.h-medium .md-by-note {
  font-size: 13px;
  line-height: 1.45;
  color: var(--h-medium-grey);
  max-width: 25rem;
}

.h-medium .md-toggle {
  appearance: none;
  -webkit-appearance: none;
  background: none;
  border: 0;
  padding: 0;
  margin: 0;
  font: inherit;
  font-size: 13px;
  color: var(--h-medium-grey);
  cursor: pointer;
  border-bottom: 1px solid var(--h-medium-rule);
  white-space: nowrap;
}
.h-medium .md-toggle:hover { color: var(--h-medium-ink); border-bottom-color: var(--h-medium-ink); }

.h-medium .md-desc {
  margin-top: 1.125rem;
  font-size: 13px;
  color: var(--h-medium-grey);
}
.h-medium .md-desc > summary {
  cursor: pointer;
  list-style: none;
  color: var(--h-medium-grey);
  width: fit-content;
}
.h-medium .md-desc > summary::-webkit-details-marker { display: none; }
.h-medium .md-desc > summary::before { content: "＋ "; font-size: 11px; }
.h-medium .md-desc[open] > summary::before { content: "－ "; }
.h-medium .md-desc-body {
  margin-top: 0.625rem;
  font-family: var(--h-medium-serif);
  font-size: 15px;
  line-height: 1.62;
  color: var(--h-medium-ink-2);
}

/* ---------- the three-dot separator ------------------------ */

.h-medium .md-dots {
  margin-block: 2.75rem;
  margin-inline: var(--h-medium-gut) 0;  /* centred on the measure, not on the rail */
  max-width: var(--h-medium-mw);
  text-align: center;
  color: #a5a29e;
  font-size: 19px;
  letter-spacing: 0.65em;
  text-indent: 0.65em;
  line-height: 1;
  user-select: none;
}
.h-medium .md-dots.md-dots-tight { margin-block: 2.25rem; }

/* ---------- the reading frame ------------------------------ */

.h-medium .md-frame {
  display: grid;
  grid-template-columns: var(--h-medium-gut) minmax(0, 1fr);
  align-items: start;
}

.h-medium .md-gutter { grid-column: 1; }

.h-medium .md-measure {
  grid-column: 2;
  min-width: 0;
  max-width: var(--h-medium-mw);
  font-family: var(--h-medium-serif);
}

/* ---------- lyric lines ------------------------------------ */

.h-medium .md-line {
  position: relative;
  font-size: var(--h-medium-ly);
  line-height: var(--h-medium-lh);
  letter-spacing: -0.003em;
  color: var(--h-medium-ink);
}

.h-medium .md-tx {
  padding: 6px 5px;
  margin-left: -5px;
  border-radius: 1px;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
}

/* endorsed highlight */
.h-medium .md-line.md-hi .md-tx { background-color: var(--h-medium-tint); }
/* two annotations land on the same line (1.5% of lines) */
.h-medium .md-line.md-hi2 .md-tx { background-color: var(--h-medium-tint-2); }
/* the repeat of a passage already marked earlier */
.h-medium .md-line.md-echo .md-tx { background-color: var(--h-medium-tint-echo); }
/* a note on this line is open */
.h-medium .md-line.md-open .md-tx { background-color: var(--h-medium-tint-on); }

/* status partial: only the opening matched, the range is approximate,
   so the tint is allowed to run out instead of ending on a hard edge */
.h-medium .md-line.md-fade .md-tx {
  background-color: transparent;
  background-image: linear-gradient(to bottom, var(--h-medium-tint) 42%, rgba(253, 242, 205, 0));
}
.h-medium .md-line.md-fade.md-open .md-tx {
  background-image: linear-gradient(to bottom, var(--h-medium-tint-on) 42%, rgba(247, 226, 155, 0));
}

/* a disputed reading is never a fill — it is a dashed rule under the words,
   so it also composes with an endorsed highlight on a shared line */
.h-medium .md-line.md-dis .md-tx {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-color: var(--h-medium-dispute);
  text-decoration-thickness: 1.5px;
  text-underline-offset: 5px;
}
.h-medium .md-line.md-dis.md-open .md-tx {
  text-decoration-color: var(--h-medium-dispute-on);
}

/* a stanza break. It occupies one entry in the numbering, so it keeps
   exactly one line of height — the same mark as the section rule, quieter */
.h-medium .md-gap {
  height: var(--h-medium-lh);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #d2cfca;
  font-size: 16px;
  letter-spacing: 0.6em;
  text-indent: 0.6em;
  user-select: none;
}

.h-medium .md-ar {
  font-family: var(--h-medium-arab);
  font-size: 1.1em;
}

/* range bracket in the gutter — one hairline segment per covered line,
   stacked so a multi-line range reads as one continuous rule */
.h-medium .md-br {
  position: absolute;
  top: 0;
  bottom: 0;
  left: var(--h-medium-b0);
  width: 1px;
  background: var(--h-medium-rule);
  pointer-events: none;
}
.h-medium .md-br.md-br-lane1 { left: var(--h-medium-b1); }
.h-medium .md-br.md-br-on { background: var(--h-medium-ink); }
.h-medium .md-br.md-br-echo {
  background-image: repeating-linear-gradient(to bottom, var(--h-medium-rule) 0 2px, transparent 2px 5px);
  background-color: transparent;
}
.h-medium .md-br.md-br-partial {
  background-image: repeating-linear-gradient(to bottom, var(--h-medium-rule) 0 4px, transparent 4px 8px);
  background-color: transparent;
}
.h-medium .md-br.md-br-dis {
  background-image: repeating-linear-gradient(to bottom, var(--h-medium-dispute) 0 3px, transparent 3px 6px);
  background-color: transparent;
}
.h-medium .md-br.md-br-dis.md-br-on {
  background-image: repeating-linear-gradient(to bottom, var(--h-medium-dispute-on) 0 3px, transparent 3px 6px);
}

/* the note marker sits at the end of the last line of its range, inside a
   zero-advance wrapper so a full-measure lyric line never breaks a word just
   to fit one digit — the digit hangs into the margin instead. */
.h-medium .md-mkwrap {
  display: inline-block;
  width: 0;
  overflow: visible;
  white-space: nowrap;
  vertical-align: baseline;
}
/* two ranges ending on the same line: give the markers real width back */
.h-medium .md-mkwrap.md-mkwrap-flow { width: auto; }

.h-medium .md-mk {
  appearance: none;
  -webkit-appearance: none;
  background: none;
  border: 0;
  display: inline-block;
  margin: 0 0 0 5px;
  padding: 0;
  font-family: var(--h-medium-sans);
  font-size: 11px;
  font-weight: 500;
  line-height: 1;
  letter-spacing: 0.01em;
  color: var(--h-medium-grey-2);
  cursor: pointer;
  vertical-align: 0.52em;
  white-space: nowrap;
}
.h-medium .md-mk:hover { color: var(--h-medium-ink); }
.h-medium .md-mk[aria-expanded="true"] {
  color: var(--h-medium-ink);
  text-decoration: underline;
  text-underline-offset: 2px;
}
.h-medium .md-mk.md-mk-dis { color: var(--h-medium-dispute-on); }

/* ---------- the rail, just off the measure ------------------ */

.h-medium .md-rail { display: none; }

.h-medium .md-stub {
  position: absolute;
  left: 0;
  width: 100%;
  text-align: left;
  appearance: none;
  -webkit-appearance: none;
  background: none;
  border: 0;
  border-left: 1px solid var(--h-medium-rule-2);
  padding: 0 0 0 0.75rem;
  margin: 0;
  font-family: var(--h-medium-sans);
  cursor: pointer;
  color: var(--h-medium-grey);
  display: block;
}
.h-medium .md-stub:hover { border-left-color: var(--h-medium-grey-2); color: var(--h-medium-ink); }
.h-medium .md-stub.md-stub-on { border-left-color: var(--h-medium-ink); color: var(--h-medium-ink); }

.h-medium .md-stub-n {
  display: block;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.04em;
  color: var(--h-medium-grey-2);
  margin-bottom: 0.1875rem;
}
.h-medium .md-stub.md-stub-on .md-stub-n { color: var(--h-medium-ink); }

.h-medium .md-stub-t {
  display: -webkit-box;
  -webkit-line-clamp: 3;
  line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
  font-size: 12.5px;
  line-height: 1.5;
  letter-spacing: -0.003em;
}

/* ---------- the note ---------------------------------------- */

.h-medium .md-note {
  margin: 1.5rem 0 1.75rem;
  border-left: 2px solid var(--h-medium-tint-on);
  padding-left: 1.25rem;
}
.h-medium .md-note.md-note-dis {
  border-left-style: dashed;
  border-left-color: var(--h-medium-dispute);
}
.h-medium .md-note[hidden] { display: none; }

.h-medium .md-note-in { animation: h-medium-rise 200ms cubic-bezier(0.2, 0, 0.1, 1) both; }

@keyframes h-medium-rise {
  from { opacity: 0; transform: translateY(5px); }
  to   { opacity: 1; transform: none; }
}

.h-medium .md-nmeta {
  font-family: var(--h-medium-sans);
  font-size: 12px;
  line-height: 1.5;
  color: var(--h-medium-grey);
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 0 0.4rem;
  margin-bottom: 0.625rem;
}
.h-medium .md-nnum { font-weight: 600; color: var(--h-medium-ink); letter-spacing: 0.02em; }
.h-medium .md-sep { color: var(--h-medium-rule); }
.h-medium .md-nstat { color: var(--h-medium-grey); }
.h-medium .md-nvote { color: var(--h-medium-grey-2); font-variant-numeric: tabular-nums; }
.h-medium .md-nvote.md-nvote-dis { color: var(--h-medium-dispute-on); }
.h-medium .md-ngid { color: #bdbab6; }

.h-medium .md-ngist {
  margin: 0 0 0.875rem;
  font-family: var(--h-medium-sans);
  font-size: 14px;
  line-height: 1.55;
  font-weight: 500;
  color: var(--h-medium-ink);
  letter-spacing: -0.005em;
}

.h-medium .md-nbody {
  font-family: var(--h-medium-serif);
  font-size: 17px;
  line-height: 1.68;
  letter-spacing: -0.003em;
  color: var(--h-medium-ink-2);
}
.h-medium .md-p { margin: 0 0 1.05em; }
.h-medium .md-p:last-child { margin-bottom: 0; }

/* no italic: Korean has no true italic and browsers fake it badly.
   The rule, the indent and the grey carry the quotation instead. */
.h-medium .md-quote {
  margin: 1.25em 0;
  padding-left: 1.125rem;
  border-left: 2px solid var(--h-medium-rule);
  color: var(--h-medium-grey);
  font-size: 16px;
  line-height: 1.72;
}
.h-medium .md-quote .md-p:last-child { margin-bottom: 0; }

.h-medium .md-code {
  font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  font-size: 0.84em;
  background: #f4f2ef;
  padding: 0.1em 0.35em;
  border-radius: 2px;
  word-break: break-all;
}

.h-medium .md-link {
  color: inherit;
  text-decoration: underline;
  text-decoration-color: var(--h-medium-rule);
  text-underline-offset: 3px;
  word-break: break-all;
}
.h-medium .md-link:hover { text-decoration-color: currentColor; }

.h-medium .md-xref {
  appearance: none;
  -webkit-appearance: none;
  background: none;
  border: 0;
  padding: 0;
  margin: 0;
  font: inherit;
  color: inherit;
  cursor: pointer;
  text-decoration: underline;
  text-decoration-style: dotted;
  text-underline-offset: 3px;
}
.h-medium .md-xref:hover { text-decoration-style: solid; }

.h-medium .md-nes {
  margin-top: 1.125rem;
  font-family: var(--h-medium-sans);
  font-size: 12px;
  color: var(--h-medium-grey);
}
.h-medium .md-nes > summary {
  cursor: pointer;
  list-style: none;
  width: fit-content;
}
.h-medium .md-nes > summary::-webkit-details-marker { display: none; }
.h-medium .md-nes > summary::before { content: "＋ "; font-size: 10px; }
.h-medium .md-nes[open] > summary::before { content: "－ "; }
.h-medium .md-nes-body {
  margin-top: 0.625rem;
  font-family: var(--h-medium-serif);
  font-size: 14.5px;
  line-height: 1.66;
  color: var(--h-medium-grey);
}

.h-medium .md-nfoot {
  margin-top: 1.125rem;
  padding-top: 0.75rem;
  border-top: 1px solid var(--h-medium-rule-2);
  display: flex;
  flex-wrap: wrap;
  gap: 0.375rem 1.25rem;
  font-family: var(--h-medium-sans);
  font-size: 12px;
  color: var(--h-medium-grey);
}
.h-medium .md-close {
  appearance: none;
  -webkit-appearance: none;
  background: none;
  border: 0;
  padding: 0;
  margin: 0;
  font: inherit;
  color: var(--h-medium-grey);
  cursor: pointer;
  text-decoration: underline;
  text-decoration-color: var(--h-medium-rule);
  text-underline-offset: 3px;
}
.h-medium .md-close:hover { color: var(--h-medium-ink); }

/* ---------- notes that never landed on a line --------------- */

.h-medium .md-tail {
  margin-left: var(--h-medium-gut);
  max-width: var(--h-medium-mw);
}
.h-medium .md-tail-h {
  margin: 0;
  font-family: var(--h-medium-sans);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.02em;
  color: var(--h-medium-ink);
}
.h-medium .md-tail-note {
  margin: 0.375rem 0 1.25rem;
  font-size: 13px;
  line-height: 1.55;
  color: var(--h-medium-grey);
}

.h-medium .md-orphan { border-top: 1px solid var(--h-medium-rule-2); }
.h-medium .md-orphan:last-child { border-bottom: 1px solid var(--h-medium-rule-2); }

.h-medium .md-orow {
  appearance: none;
  -webkit-appearance: none;
  background: none;
  border: 0;
  width: 100%;
  text-align: left;
  display: grid;
  grid-template-columns: 1.75rem minmax(0, 1fr);
  gap: 0 0.25rem;
  padding: 0.875rem 0;
  margin: 0;
  font: inherit;
  cursor: pointer;
  color: var(--h-medium-grey);
}
.h-medium .md-orow:hover { color: var(--h-medium-ink); }
.h-medium .md-onum {
  font-family: var(--h-medium-sans);
  font-size: 11px;
  font-weight: 500;
  color: var(--h-medium-grey-2);
  padding-top: 0.28rem;
  letter-spacing: 0.04em;
}
.h-medium .md-orow[aria-expanded="true"] .md-onum { color: var(--h-medium-ink); }
.h-medium .md-olabel {
  display: block;
  font-family: var(--h-medium-sans);
  font-size: 12px;
  color: var(--h-medium-grey-2);
  margin-bottom: 0.1875rem;
}
.h-medium .md-ofrag {
  display: block;
  font-family: var(--h-medium-serif);
  font-size: 16px;
  line-height: 1.5;
  color: var(--h-medium-ink);
  letter-spacing: -0.003em;
}
.h-medium .md-orphan .md-note { margin: 0 0 1.5rem; }

/* ---------- footer ------------------------------------------ */

.h-medium .md-foot {
  margin-left: var(--h-medium-gut);
  max-width: var(--h-medium-mw);
  margin-top: 2.75rem;
  padding-top: 1rem;
  border-top: 1px solid var(--h-medium-rule);
  font-size: 12px;
  line-height: 1.65;
  color: var(--h-medium-grey-2);
}
.h-medium .md-foot .md-link { text-decoration-color: var(--h-medium-rule); }

/* ---------- wider column: essay proportions ------------------ */

@container h-medium-col (min-width: 34rem) {
  .h-medium .md-shell {
    --h-medium-gut: 2.5rem;
    --h-medium-b0: -1.75rem;
    --h-medium-b1: -1rem;
    --h-medium-mw: 38rem;
    --h-medium-ly: 21px;
    --h-medium-lh: 37px;
    padding-inline: 1.5rem;
  }
  .h-medium .md-title { font-size: 42px; letter-spacing: -0.026em; }
  .h-medium .md-title-orig { font-size: 15px; }
  .h-medium .md-sub { font-size: 16px; }
  .h-medium .md-nbody { font-size: 18px; line-height: 1.7; }
  .h-medium .md-quote { font-size: 17px; }
  .h-medium .md-nes-body { font-size: 15px; }
  .h-medium .md-ngist { font-size: 15px; }
}

/* ---------- widest: the rail appears ------------------------- */

@container h-medium-col (min-width: 62rem) {
  .h-medium .md-shell { max-width: 62.25rem; }
  .h-medium .md-frame {
    grid-template-columns: var(--h-medium-gut) minmax(0, var(--h-medium-mw)) 2rem 17rem;
  }
  .h-medium .md-rail {
    display: block;
    grid-column: 4;
    position: relative;
    align-self: stretch;
    min-height: 1px;
  }
}

/* ---------- narrow column: keep the lyric breathing ---------- */

@container h-medium-col (max-width: 24rem) {
  .h-medium .md-shell { --h-medium-ly: 19px; --h-medium-lh: 33px; }
  .h-medium .md-title { font-size: 28px; }
}

@media (prefers-reduced-motion: reduce) {
  .h-medium .md-note-in { animation: none; }
  .h-medium .md-stub { transition: none; }
}
</style>

<script>
(function () {
  'use strict';

  window.HOUSES = window.HOUSES || {};

  var UID = 0;

  /* ---------- small helpers -------------------------------- */

  function el(tag, cls, txt) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (txt != null) n.textContent = txt;
    return n;
  }

  function esc(s) {
    return String(s == null ? '' : s)

    inner.appendChild(body);

    if (a.body_es && a.body_es.trim()) {
      var det = el('details', 'md-nes');
      det.appendChild(el('summary', null, 'Genius 원문 주석 (스페인어) 보기'));
      var eb = el('div', 'md-nes-body');
      eb.innerHTML = renderBody(a.body_es);
      det.appendChild(eb);
      inner.appendChild(det);
    }

    var foot = el('div', 'md-nfoot');
    if (a.url) {
      var link = el('a', 'md-link', 'Genius에서 이 주석 보기');
      link.href = a.url;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      foot.appendChild(link);
    }
    var close = el('button', 'md-close', '접기');
    close.type = 'button';
    close.setAttribute('data-close', String(r.no));
    foot.appendChild(close);
    inner.appendChild(foot);

    note.appendChild(inner);
    return note;
  }

  window.HOUSES['medium'] = {
    name: '에세이',
    ref: 'Medium 읽기·하이라이트 화면',
    blurb: '가사를 한 단 폭의 에세이로 조판하고, 표시된 대목에만 옅은 톤을 깔아 주석이 읽는 리듬을 끊지 않게 한다.',
    gives_up: '한눈에 훑는 밀도와 색을 버린다 — 25행이 표시된 트랙도 지도처럼 조망할 수 없고, 주석은 결국 하나씩 열어 읽어야 한다.',
    mount: mount,
    unmount: function (root) {
      if (root.__hMediumCleanup) { root.__hMediumCleanup(); root.__hMediumCleanup = null; }
      root.innerHTML = '';
    }
  };
})();
</script>
